# Локальное окружение разработки. Продакшен-конфигурация (api + caddy) — в фазе 8.
name: prolez

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: prolez
      POSTGRES_PASSWORD: prolez
      POSTGRES_DB: prolez
    ports:
      # 5432 и 5433 на машине разработки заняты другими Postgres
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prolez -d prolez']
      interval: 5s
      retries: 10

  minio:
    # Образа minio/minio на Docker Hub больше нет — берём с quay.io
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: prolez
      MINIO_ROOT_PASSWORD: prolez-dev-secret
    ports:
      # 9000–9001 заняты MinIO других проектов
      - '9010:9000'
      - '9011:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
